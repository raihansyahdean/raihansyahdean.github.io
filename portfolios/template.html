<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The real <title> is set from portfolio-data.js; this is the fallback -->
    <title>Portfolio — Raihansyah A. Andrian</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/layout.css">

<!-- ═══════════════════════════════════════════════════════════════════
     TO MAKE A NEW PORTFOLIO PAGE:
       1. Copy this file and rename it, e.g. portfolios/audio.html
       2. Change data-portfolio below to a new key, e.g. "audio"
       3. Add an entry under that key in js/data/portfolio-data.js
       4. Add it to PORTFOLIO_ITEMS in js/core/layout.js so it appears
          in the Portfolios nav dropdown

     Everything on the page — layout AND content — comes from those two
     files, so this shell never needs editing again.
     ═══════════════════════════════════════════════════════════════════ -->
<body data-page="portfolio" data-root="../" data-portfolio="CHANGE-ME">

    <script src="../js/core/layout.js"></script>

    <!-- Filled in by js/core/portfolioPage.js -->
    <main class="container page active portfolio-page"></main>

    <script src="../js/data/portfolio-data.js"></script>
    <script src="../js/core/portfolioPage.js"></script>
    <script src="../js/core/particles.js"></script>
</body>
</html>
