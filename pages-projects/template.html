<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- The real <title> is set from project-pages.js; this is the fallback -->
    <title>Project — Raihansyah A. Andrian</title>

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/pages/detail.css">
</head>
<!-- ═══════════════════════════════════════════════════════════════════
     TO MAKE A NEW DETAIL PAGE:
       1. Copy this file and rename it, e.g. pages-projects/my-game.html
       2. Change data-project below to match, e.g. "my-game"
       3. Add an entry under that key in js/data/project-pages.js
       4. Add the file path to AVAILABLE_PROJECT_PAGES in js/pages/projects.js
          (or AVAILABLE_EXPERIENCE_PAGES in js/pages/experience.js)

     The same shell works for pages-experience/ — nothing to change.
     ═══════════════════════════════════════════════════════════════════ -->
<body data-root="../" data-project="CHANGE-ME">

    <!-- The back button's label and link are set by js/core/backButton.js
         based on where the visitor came from. -->
    <div class="project-header">
        <a href="../projects.html" class="back-button">← Back to Projects</a>
    </div>

    <!-- Filled in by js/core/projectPage.js -->
    <main class="container"></main>

    <script src="../js/data/project-pages.js"></script>
    <script src="../js/core/projectPage.js"></script>
    <script src="../js/core/slideshow.js"></script>
    <script src="../js/core/backButton.js"></script>
</body>
</html>
